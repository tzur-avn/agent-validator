# Example configuration file
# Copy this to config.yaml and customize for your needs

agents:
  spell_checker:
    enabled: true
    provider: "gemini"  # Options: gemini, openai
    model: "gemini-2.5-flash"  # For OpenAI: gpt-4o, gpt-4-turbo, gpt-3.5-turbo
    temperature: 0
    max_text_length: 10000
  
  visual_qa:
    enabled: true
    provider: "gemini"  # Options: gemini, openai
    model: "gemini-2.5-flash"  # For OpenAI: gpt-4o, gpt-4-turbo (vision models)
    temperature: 0
    viewports:
      - width: 1920
        height: 1080
        name: "Desktop"

targets:
  - url: "https://www.example.com"
    agents: ["spell_checker", "visual_qa"]
  
  # Example with form-based authentication using single URL
  - url: "http://localhost:3001/customer-center"
    agents: ["spell_checker", "visual_qa"]
    auth:
      type: "form"  # Options: "form" or "basic"
      username: "${AUTH_USERNAME}"  # Use environment variables for security
      password: "${AUTH_PASSWORD}"  # export AUTH_USERNAME=admin
      selectors:  # Required for form-based auth
        username: "input[name='username']"
        password: "input[name='password']"
        submit: "button[type='submit']"
  
  # Example with multiple URLs sharing the same authentication
  # Use 'urls' (plural) to list multiple URLs - much cleaner!
  - urls:
      - "http://localhost:3001/dashboard"
      - "http://localhost:3001/reports"
      - "http://localhost:3001/settings"
    agents: ["spell_checker", "visual_qa"]
    auth:
      type: "form"
      username: "${AUTH_USERNAME}"
      password: "${AUTH_PASSWORD}"
      selectors:
        username: "input[name='username']"
        password: "input[name='password']"
        submit: "button[type='submit']"
  
  # Example with HTTP Basic Authentication
  - url: "https://secure.example.com/admin"
    agents: ["spell_checker"]
    auth:
      type: "basic"
      username: "admin"
      password: "${ADMIN_PASSWORD}"  # Environment variable support

output:
  format: "text"
  path: "./reports"
  timestamp: true
