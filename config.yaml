# Agent Validator Configuration

# Agent configurations
agents:
  spell_checker:
    enabled: true
    provider: "openai"  # Options: gemini, openai
    model: "gpt-4o"  # OpenAI models: gpt-4o, gpt-4-turbo, gpt-3.5-turbo
    temperature: 0
    max_text_length: 10000
    wait_time: 2000  # milliseconds to wait for dynamic content
  
  visual_qa:
    enabled: true
    provider: "openai"  # Options: gemini, openai
    model: "gpt-4o"  # OpenAI vision models: gpt-4o, gpt-4-turbo
    temperature: 0
    viewports:
      - width: 1920
        height: 1080
        name: "Desktop"
    wait_time: 5000  # milliseconds to wait before screenshot

  accessibility:
    enabled: false
    provider: "openai"
    model: "gpt-4o"
    temperature: 0
    viewport_width: 1920
    viewport_height: 1080
    wait_time: 3000

  performance:
    enabled: false
    wait_time: 5000  # milliseconds to wait after load before collecting metrics

  seo:
    enabled: false
    provider: "openai"
    model: "gpt-4o"
    temperature: 0

  broken_links:
    enabled: false
    max_links: 100    # maximum links to check per page
    link_timeout: 10  # seconds per HTTP request

  security_headers:
    enabled: false


# Use 'urls' (plural) to specify multiple URLs with the same auth config
# The system will authenticate once and reuse the session across all URLs

# targets:
#   - urls:
#       - "http://localhost:3001/customer-center"
