#       selectors:
#         username: 'input[type="text"]'
#         password: 'input[type="password"]'
#         submit: 'button[type="submit"]'

targets:
  - url: "http://bbc.com"
    agents:
      - spell_checker
      - visual_qa

output:
  format: html
  path: reports/

# Browser configuration
browser:
  headless: true
  timeout: 60000  # milliseconds

# Retry configuration
retry:
  max_retries: 3
  initial_delay: 1.0
  exponential_base: 2.0

# LangSmith integration configuration
langsmith:
  enabled: false  # Set to true to enable LangSmith tracing

